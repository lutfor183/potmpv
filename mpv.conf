# PotMPV - PotPlayer-like defaults for mpv
# Low CPU/GPU cost: no interpolation, no deband, hardware decoding on.

vo=gpu
gpu-api=auto
gpu-context=auto
hwdec=auto-safe
hwdec-extra-frames=4
video-sync=audio
interpolation=no
scale=lanczos
dscale=lanczos
cscale=lanczos
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=no
deband=no
dither-depth=auto

force-window=yes
idle=yes
keep-open=yes
keep-open-pause=no
autofit-larger=90%x90%
geometry=50%:50%
border=yes
snap-window=yes
title=${media-title} - PotMPV
osc=no
osd-level=1
osd-font=Roboto
cursor-autohide=1000

cache=yes
cache-secs=90
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=64MiB
demuxer-readahead-secs=20
force-seekable=yes
hr-seek=yes
hr-seek-framedrop=yes

volume=100
volume-max=130
audio-file-auto=fuzzy
audio-normalize-downmix=no
gapless-audio=weak
audio-pitch-correction=yes

sub-auto=fuzzy
sub-font=Roboto
sub-font-size=48
sub-color="#FFFFFFFF"
sub-border-size=2.2
sub-border-color="#FF000000"
sub-shadow-offset=0.6
sub-shadow-color="#80000000"
sub-blur=0.1
sub-margin-y=30
sub-ass-override=scale

screenshot-format=png
screenshot-directory=~~/screenshots
screenshot-template="%f_%03n"

save-position-on-quit=yes
directory-mode=auto

# keep only our seek bar (no built-in OSD bar on seek)
osd-on-seek=no
