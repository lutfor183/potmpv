# PotMPV key map (PotPlayer-style)
MBTN_LEFT script-message pot-click
MBTN_LEFT_DBL script-message pot-dblclick
MBTN_MID script-message pot-mid
MBTN_RIGHT script-message-to pot_menu menu
WHEEL_UP script-message pot-wheel up
WHEEL_DOWN script-message pot-wheel down
Shift+WHEEL_UP script-message pot-wheel up shift
Shift+WHEEL_DOWN script-message pot-wheel down shift
Ctrl+WHEEL_UP script-message pot-wheel up ctrl
Ctrl+WHEEL_DOWN script-message pot-wheel down ctrl

SPACE cycle pause
ENTER cycle fullscreen
f cycle fullscreen
ESC set fullscreen no
LEFT seek -5
RIGHT seek 5
Shift+LEFT seek -30
Shift+RIGHT seek 30
Ctrl+LEFT seek -30
Ctrl+RIGHT seek 30
UP add volume 5
DOWN add volume -5
9 add volume -5
0 add volume 5
m cycle mute
[ add speed -0.10
] add speed 0.10
BS set speed 1.0
PGUP playlist-prev
PGDWN playlist-next
s screenshot
d cycle deinterlace
# cycle audio
j cycle sub
v cycle sub-visibility
T cycle ontop
i script-binding stats/display-stats-toggle
~ script-binding console/enable

F5 script-message-to pot_prefs open
F6 script-message pot-toggle-playlist
Ctrl+o script-message-to pot_menu open-file
Ctrl+u script-message-to pot_menu open-file
Ctrl+q quit
